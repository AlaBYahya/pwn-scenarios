name: Validate dataset and graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Reassemble scenarios.jsonl from chunks and verify checksum
        # scenarios.jsonl itself isn't committed (see .gitignore) -- only the
        # fixed-size chunks under data/scenarios/chunks/ are. This both
        # reconstructs the working file for the rest of the job and confirms
        # the chunks weren't corrupted/truncated in transit.
        run: |
          cat data/scenarios/chunks/scenarios.part*.jsonl > data/scenarios/scenarios.jsonl
          python3 -c "
          import hashlib, json
          manifest = json.load(open('data/scenarios/chunks/manifest.json'))
          actual = hashlib.sha256(open('data/scenarios/scenarios.jsonl', 'rb').read()).hexdigest()
          assert actual == manifest['sha256'], f\"checksum mismatch: manifest={manifest['sha256']} actual={actual}\"
          actual_count = sum(1 for _ in open('data/scenarios/scenarios.jsonl'))
          assert actual_count == manifest['total_records'], f\"record count mismatch: manifest={manifest['total_records']} actual={actual_count}\"
          print(f\"OK: {actual_count} records, checksum matches manifest\")
          "

      - name: Validate scenario dataset against schema
        run: |
          cd scripts
          python3 validate.py --data ../data/scenarios/scenarios.jsonl --schema ../schema/scenario.schema.json

      - name: Rebuild attack graph from source and confirm it matches the committed file
        run: |
          cd scripts
          python3 build_graph.py \
            --playbooks ../knowledge/vulnerability_playbooks.json \
            --bridges ../knowledge/graph/bridges.json \
            --tech-bridges ../knowledge/graph/technology_bridges.json \
            --ai-bridges ../knowledge/graph/ai_bridges.json \
            --out /tmp/regenerated_graph.json
          diff /tmp/regenerated_graph.json ../data/graph/attack_graph.json || \
            (echo "::error::data/graph/attack_graph.json is out of date -- run scripts/build_graph.py and commit the result." && exit 1)

      - name: Validate attack graph schema + referential integrity + reachability
        run: |
          cd scripts
          python3 validate_graph.py --graph ../data/graph/attack_graph.json --schema ../schema/graph.schema.json

      - name: Build the derived views (by-class split + SQLite index) and sanity-check them
        # These aren't committed (see .gitignore) -- this just confirms build_views.py
        # still runs cleanly against the current scenarios.jsonl and produces a
        # SQLite row count matching it, catching schema drift between the two.
        run: |
          cd scripts
          python3 build_views.py --data ../data/scenarios/scenarios.jsonl --by-class-dir /tmp/by_class --db /tmp/index.sqlite3
          jsonl_count=$(wc -l < ../data/scenarios/scenarios.jsonl)
          db_count=$(python3 -c "import sqlite3; print(sqlite3.connect('/tmp/index.sqlite3').execute('SELECT COUNT(*) FROM scenarios').fetchone()[0])")
          by_class_count=$(cat /tmp/by_class/*.jsonl | wc -l)
          echo "scenarios.jsonl: $jsonl_count | sqlite rows: $db_count | by_class total: $by_class_count"
          [ "$jsonl_count" -eq "$db_count" ] && [ "$jsonl_count" -eq "$by_class_count" ] || \
            (echo "::error::Derived view record counts don't match scenarios.jsonl -- build_views.py may be broken." && exit 1)
